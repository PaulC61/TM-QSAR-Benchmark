[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tm_qsar_benchmark"
version = "0.1.0"
description = "Consolidated TM vs RandomForest vs XGBoost QSAR benchmarking pipeline."
requires-python = ">=3.12"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "slow: exercises a full (if tiny) end-to-end benchmark run; may take a minute or more.",
]

# Lint/format config. Kept deliberately light-touch for a scientific
# codebase with heavy numpy/pandas/sklearn/rdkit usage: the goal is a
# clean, passing CI baseline going forward, not full strict-mode
# compliance or a retroactive rewrite of existing code.
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
# dev/* are vendored git submodules (third-party native-extension
# packages) -- never lint/format those as if they were our own code.
extend-exclude = ["dev"]

[tool.ruff.lint]
# Pyflakes + pycodestyle + import-sort + pyupgrade; a reasonable, common
# baseline rather than ruff's full/"ALL" rule set.
select = ["E", "F", "I", "UP", "W"]
# E501 (line-too-long) is ignored rather than reformatted: existing code
# has many long lines (data-wrangling/metric-writing calls with many
# keyword args), and reflowing them all is a style-only churn unrelated to
# this tooling change -- `ruff format` already targets a sane line length
# for *new* code, this just avoids retroactively failing CI on existing
# lines.
ignore = ["E501"]

[tool.ruff.format]
# Pre-existing modules that predate `ruff format` adoption and are not yet
# reformatted here, to keep this tooling PR free of large, logic-unrelated
# reflow diffs across the pipeline/analysis code. `ruff format` already
# applies (and `format-check` enforces) on any new or newly-touched file;
# this baseline exclusion only grandfathers in current files. Remove an
# entry once that file has been reformatted (e.g. in a dedicated,
# review-friendly "reformat X" commit).
exclude = [
    "src/tm_qsar_benchmark/analysis/model_comparison.py",
    "src/tm_qsar_benchmark/binarizer.py",
    "src/tm_qsar_benchmark/cli.py",
    "src/tm_qsar_benchmark/config.py",
    "src/tm_qsar_benchmark/descriptors.py",
    "src/tm_qsar_benchmark/final_model.py",
    "src/tm_qsar_benchmark/hardware.py",
    "src/tm_qsar_benchmark/metrics.py",
    "src/tm_qsar_benchmark/pipeline.py",
    "src/tm_qsar_benchmark/tm_backends.py",
    "tests/test_pipeline_smoke.py",
]

[tool.mypy]
python_version = "3.12"
files = ["src"]
exclude = ["^dev/"]
# Lenient-by-design: third-party scientific packages are either untyped or
# have incomplete/optional stubs, and we don't vendor stubs for them here.
ignore_missing_imports = true
# Opt-in strictness signals without full `--strict` (which would currently
# surface a large number of pre-existing findings unrelated to this
# tooling change); tighten incrementally over time instead.
warn_unused_configs = true
warn_redundant_casts = true
no_implicit_optional = false
check_untyped_defs = false

# pixi's environment/dependency/task config lives here too (under
# [tool.pixi.*]) instead of a separate pixi.toml -- one file, one source of
# truth for both "this is an installable Python package" (the [project]
# table above) and "this is how to set up/run it" (pixi).
[tool.pixi.workspace]
name = "TM-QSAR-Benchmark"
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-64", "osx-arm64"]

[tool.pixi.tasks]
# One-time setup (run in this order on a fresh clone):
#   1. git submodule update --init --recursive
#   2. pixi run fix-submodules
#   3. pixi install                (GPU server: also `pixi install -e gpu`)
fix-submodules = "python scripts/patch_native_deps.py"
test = "pytest -sv tests/"
describe-hardware = "python -m tm_qsar_benchmark.cli --describe-hardware"
# TM backend (cpu/parallel/gpu) is auto-selected based on detected hardware;
# override with `pixi run benchmark --n-clauses 800 -- --backend cpu`. The
# gpu backend is just tmu's own CUDA clause bank (platform="CUDA"), gated
# behind the opt-in `gpu` pixi feature/environment below (needs `pycuda`,
# which needs a real CUDA toolchain -- install it too on a GPU box with
# `pixi install -e gpu`).
# Clause count is a plain parameter (no "benchmark-8"-style qualitative
# tags) -- pass whatever --n-clauses value you want.
benchmark = "python -m tm_qsar_benchmark.cli"
smoke-test = "python -m tm_qsar_benchmark.cli --n-clauses 800 --datasets opioids/MOR_cutoff6.csv --n-outer 1 --n-inner 2 --n-trials 2 --n-tm-epochs 2 --run-label smoketest --resume -v"

[tool.pixi.dependencies]
# tmu, pyTsetlinMachineParallel and chembl_structure_pipeline (see
# [tool.pixi.pypi-dependencies] below) are editable installs of native C
# extensions (dev/*). c-compiler/cxx-compiler pull in conda-forge's
# platform-appropriate compiler + SDK/sysroot activation (this is what
# makes e.g. macOS builds find headers like assert.h), so `pixi install`
# can build them from source on any of this workspace's platforms.
c-compiler = "*"
cxx-compiler = "*"
python = ">=3.12"
pip = "*"
numpy = ">=2.3.0,<3"
scipy = ">=1.15.2,<2"
ipdb = ">=0.13.13,<0.14"
pandas = ">=2.3.0,<3"
scikit-learn = ">=1.7.0,<2"
ptyprocess = ">=0.7.0,<0.8"
pyzmq = ">=26.4.0,<27"
optuna = ">=4.4.0,<5"
libxc-c = ">=7.0.0,<8"
rdkit = ">=2025.9.2,<2026"
xgboost = ">=2.0.0,<3"
joblib = ">=1.3.0"
pytest = ">=8.0.0"

[tool.pixi.pypi-dependencies]
matplotlib = "*"
jupyterlab = "*"
ipykernel = "*"
packaging = "*"
seaborn = "*"
pingouin = "*"
statsmodels = "*"
scikit-posthocs = "*"
useful_rdkit_utils = { path = "./dev/useful_rdkit_utils", editable = true }
tmu = { path = "./dev/tmu", editable = true}
pyTsetlinMachineParallel = { path = "./dev/pyTsetlinMachineParallel", editable = true}
chembl_structure_pipeline = { path = "./dev/chembl_structure_pipeline", editable = true}
tm_qsar_benchmark = { path = ".", editable = true }

# Opt-in GPU feature: `pycuda` needs a real CUDA toolchain to build, so it
# must stay out of the default environment (or `pixi install` would fail
# on any machine without one, including a laptop). Enable it on a CUDA
# server with `pixi install -e gpu`; this only changes which pixi
# *environment* pycuda is solved/installed into -- the same tmu classes
# and pipeline code run either way, just with `platform="CUDA"` selected
# automatically once `tmu.clause_bank.clause_bank_cuda.cuda_installed` is
# True (see hardware.gpu_backend_available).
[tool.pixi.feature.gpu]
platforms = ["linux-64"]

[tool.pixi.feature.gpu.pypi-dependencies]
pycuda = "*"

# Dev-only lint/typecheck tooling, deliberately kept in its own feature and
# *not* merged into the `default` solve-group: ruff/mypy don't need numpy/
# pandas/rdkit/the native dev/* submodule builds to analyze the source, so
# giving them a standalone environment (`pixi install -e lint`) means CI's
# lint/format/typecheck jobs install in seconds and never need a C/C++
# toolchain or the git submodules at all -- only the `test` job does.
[tool.pixi.feature.lint.dependencies]
python = ">=3.12"
ruff = ">=0.8,<1"
mypy = ">=1.11,<2"

[tool.pixi.feature.lint.tasks]
lint = "ruff check src tests"
format-check = "ruff format --check src tests"
typecheck = "mypy src"

[tool.pixi.environments]
default = { solve-group = "default" }
gpu = { features = ["gpu"], solve-group = "default" }
lint = { features = ["lint"], no-default-feature = true }

